# /etc/nginx/sites-available/pdf-label
#
# Antes de habilitar, crie o arquivo de senha (o htpasswd vem no apache2-utils):
#   sudo htpasswd -c /etc/nginx/.htpasswd-pdf-label bruno
#
# Sem isso o nginx -t falha, de proposito: o servico nao tem autenticacao
# propria e renderizar PDF de terceiro e' justamente a operacao cara.

server {
    listen 443 ssl;
    http2 on;
    server_name etiqueta.SEU-DOMINIO.com.br;

    ssl_certificate     /etc/letsencrypt/live/etiqueta.SEU-DOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etiqueta.SEU-DOMINIO.com.br/privkey.pem;

    auth_basic           "Etiquetas";
    auth_basic_user_file /etc/nginx/.htpasswd-pdf-label;

    # Precisa casar com MAX_UPLOAD do server.py, senao o upload morre em 413
    # antes de chegar na aplicacao.
    client_max_body_size 25m;

    # Recorte de PDF grande leva alguns segundos; o padrao de 60s ja' basta,
    # mas deixe explicito pra nao depender do default da distro.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name etiqueta.SEU-DOMINIO.com.br;
    return 301 https://$host$request_uri;
}
