services:
  pdf-label:
    build: .
    image: pdf-label:latest
    container_name: pdf-label
    restart: unless-stopped

    # So' no loopback: quem fala com a internet e' o nginx do host.
    ports:
      - "127.0.0.1:8000:8000"

    # Nada no container precisa ser escrito, exceto os recortes temporarios.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # Renderizar PDF e' o caminho caro: limita o estrago de um arquivo hostil.
    mem_limit: 512m
    pids_limit: 128

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
